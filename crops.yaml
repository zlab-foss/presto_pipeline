workers: 8              # workers per (crop, source) group
# year is not needed: s1/s2 read their download window from each polygon's
# own candidate-crop calendar columns (pl_<crop>/hv_<crop>) in the
# shapefile-all-cc.shp produced by scripts/add_all_crop_calendars.py.
sources: [s1, s2]       # each crop runs once per source, all in parallel
log_dir: ./logs_parallel

# Single shared output root: tifs land in ./data/<source>/, manifests in
# ./data/manifest/. Crop no longer determines the output directory --
# every candidate-crop tile for every parcel of every crop lands in the
# same <source> directory, disambiguated by filename (see get_data.py's
# _mk_out_name), and rows are tied to their parcel/candidate via the
# manifest CSVs.
out: ./data
manifest_dir: ./data/manifest

crops:
  - name: barley
    shp:  ./ROI/barley/shapefile-all-cc.shp
    temp: ./tmp_tiles_barley

  - name: wheat
    shp:  ./ROI/wheat/shapefile-all-cc.shp
    temp: ./tmp_tiles_wheat

  - name: rice
    shp:  ./ROI/rice/shapefile-all-cc.shp
    temp: ./tmp_tiles_rice

  - name: corn
    shp:  ./ROI/corn/shapefile-all-cc.shp
    temp: ./tmp_tiles_corn

  - name: kolza
    shp:  ./ROI/kolza/shapefile-all-cc.shp
    temp: ./tmp_tiles_kolza

  # Per-crop overrides:
  # - name: corn
  #   shp:  ./ROI/corn/shapefile-all-cc.shp
  #   temp: ./tmp_tiles_corn
